<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タダミッケ | Project AURORA v1.1</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Noto Sans JP',sans-serif;
}

body{
background:#F3F4F6;
color:#1F2937;
}

header{
background:linear-gradient(135deg,#16A34A,#22C55E);
padding:24px 20px 32px;
border-radius:0 0 28px 28px;
color:white;
box-shadow:0 6px 18px rgba(34,197,94,.25);
}

.logo{
display:flex;
align-items:center;
gap:12px;
margin-bottom:8px;
}

.logo-icon{
width:52px;
height:52px;
border-radius:16px;
background:rgba(255,255,255,.15);
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
backdrop-filter:blur(8px);
}

.logo h1{
font-size:28px;
font-weight:700;
}

.subtitle{
font-size:14px;
opacity:.95;
margin-bottom:20px;
}

.search-box{
background:white;
border-radius:16px;
padding:12px 16px;
display:flex;
align-items:center;
gap:10px;
}

.search-box input{
border:none;
outline:none;
width:100%;
font-size:15px;
}

.container{
max-width:760px;
margin:auto;
padding:18px;
}

.card{
background:white;
border-radius:22px;
padding:18px;
margin-bottom:18px;
box-shadow:0 4px 14px rgba(0,0,0,.06);
}

.card-title{
font-size:20px;
font-weight:700;
margin-bottom:14px;
display:flex;
align-items:center;
gap:8px;
}

.map-wrap{
background:#ECFDF5;
border:2px solid #BBF7D0;
border-radius:18px;
padding:18px;
}

.japan-map{
width:100%;
height:auto;
}

.region{
fill:#BBF7D0;
stroke:#15803D;
stroke-width:1.5;
cursor:pointer;
transition:.2s;
}

.region:hover{
fill:#4ADE80;
}

.region.active{
fill:#16A34A;
}

.region-text{
font-size:7px;
font-weight:700;
pointer-events:none;
fill:#166534;
text-anchor:middle;
}

.region-text.active{
fill:white;
}

.pref-list{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:16px;
}

.pref-chip{
background:#DCFCE7;
color:#166534;
padding:10px 14px;
border-radius:999px;
font-size:13px;
font-weight:700;
cursor:pointer;
transition:.2s;
}

.pref-chip:hover{
background:#BBF7D0;
transform:translateY(-2px);
}

.category-scroll{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:6px;
}

.category-scroll::-webkit-scrollbar{
display:none;
}

.category{
white-space:nowrap;
padding:10px 16px;
border-radius:999px;
background:#F3F4F6;
font-weight:700;
font-size:13px;
cursor:pointer;
}

.category.active{
background:#16A34A;
color:white;
}

.result-title{
font-size:18px;
font-weight:700;
margin-bottom:14px;
}

.service-card{
border:1px solid #E5E7EB;
border-radius:18px;
padding:16px;
margin-bottom:14px;
transition:.2s;
}

.service-card:hover{
transform:translateY(-3px);
box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.tag-row{
display:flex;
gap:8px;
margin-bottom:10px;
flex-wrap:wrap;
}

.tag{
padding:5px 10px;
border-radius:999px;
font-size:11px;
font-weight:700;
}

.tag.green{
background:#DCFCE7;
color:#166534;
}

.tag.blue{
background:#DBEAFE;
color:#1D4ED8;
}

.service-title{
font-size:18px;
font-weight:700;
margin-bottom:8px;
}

.service-desc{
font-size:14px;
line-height:1.7;
color:#4B5563;
}

.empty{
text-align:center;
padding:32px 12px;
color:#6B7280;
}

footer{
text-align:center;
padding:26px;
font-size:12px;
color:#9CA3AF;
}

@media(max-width:480px){
.logo h1{font-size:24px;}
.card{padding:16px;}
}
</style>
</head>

<body>

<header>
<div class="logo">
<div class="logo-icon">🎁</div>
<div>
<h1>タダミッケ</h1>
<div class="subtitle">全国の無料サービス検索</div>
</div>
</div>

<div class="search-box">
<span>🔍</span>
<input id="searchInput" placeholder="IKEA・離乳食・工場見学">
</div>
</header>

<div class="container">

<div class="card">
<div class="card-title">🗾 地図から探す</div>
<div class="map-wrap">
<svg class="japan-map" viewBox="0 0 320 190">
<rect id="北海道" class="region" x="248" y="8" width="48" height="24" rx="6"/>
<text id="txt北海道" class="region-text" x="272" y="23">北海道</text>
<rect id="東北" class="region" x="240" y="42" width="34" height="42" rx="6"/>
<text id="txt東北" class="region-text" x="257" y="64">東北</text>
<rect id="関東" class="region" x="236" y="92" width="38" height="24" rx="6"/>
<text id="txt関東" class="region-text" x="255" y="107">関東</text>
<rect id="中部" class="region" x="184" y="76" width="44" height="30" rx="6"/>
<text id="txt中部" class="region-text" x="206" y="94">中部</text>
<rect id="近畿" class="region active" x="136" y="96" width="36" height="24" rx="6"/>
<text id="txt近畿" class="region-text active" x="154" y="111">近畿</text>
<rect id="中国" class="region" x="88" y="88" width="42" height="22" rx="6"/>
<text id="txt中国" class="region-text" x="109" y="102">中国</text>
<rect id="四国" class="region" x="120" y="128" width="30" height="16" rx="6"/>
<text id="txt四国" class="region-text" x="135" y="139">四国</text>
<rect id="九州" class="region" x="38" y="84" width="34" height="38" rx="6"/>
<text id="txt九州" class="region-text" x="55" y="103">九州</text>
</svg>
</div>
<div class="pref-list" id="prefList"></div>
</div>
<!-- カテゴリ -->
<div class="card">

<div class="card-title">
🏷️ カテゴリ
</div>

<div class="category-scroll" id="categoryList">

<div class="category active" data-category="すべて">
すべて
</div>

<div class="category" data-category="子育て">
子育て
</div>

<div class="category" data-category="工場見学">
工場見学
</div>

<div class="category" data-category="遊び場">
遊び場
</div>

<div class="category" data-category="動物">
動物
</div>

<div class="category" data-category="乗り物">
乗り物
</div>

</div>
</div>

<!-- 検索結果 -->
<div class="card">

<div class="result-title">
🎁 無料サービス
</div>

<div id="results">

<div class="empty">
都道府県を選択すると表示されます
</div>

</div>

</div>

</div>

<footer>
Project AURORA v1.1 © 2026 タダミッケ
</footer>

<script>

/* ========= Supabase ========= */

const SUPABASE_URL =
"https://wobkdymgdskooprhjayf.supabase.co";

const SUPABASE_KEY =
"ここにPublishable Key";


/* ========= 地方データ ========= */

const regions = {

"北海道":[
"北海道"
],

"東北":[
"青森県","岩手県","宮城県","秋田県","山形県","福島県"
],

"関東":[
"東京都","神奈川県","千葉県","埼玉県","茨城県","栃木県","群馬県"
],

"中部":[
"愛知県","静岡県","岐阜県","長野県",
"新潟県","富山県","石川県","福井県","山梨県"
],

"近畿":[
"大阪府","京都府","兵庫県","奈良県",
"滋賀県","和歌山県","三重県"
],

"中国":[
"岡山県","広島県","鳥取県","島根県","山口県"
],

"四国":[
"徳島県","香川県","愛媛県","高知県"
],

"九州":[
"福岡県","佐賀県","長崎県","熊本県",
"大分県","宮崎県","鹿児島県","沖縄県"
]

};


/* ========= 状態 ========= */

let selectedPrefecture = "大阪府";
let selectedCategory = "すべて";
let keyword = "";


/* ========= DOM ========= */

const prefList =
document.getElementById("prefList");

const results =
document.getElementById("results");

const searchInput =
document.getElementById("searchInput");


/* ========= 地方切替 ========= */

function selectRegion(region){

document
.querySelectorAll(".region")
.forEach(el=>el.classList.remove("active"));

document
.querySelectorAll(".region-text")
.forEach(el=>el.classList.remove("active"));

document
.getElementById(region)
.classList.add("active");

document
.getElementById("txt"+region)
.classList.add("active");

renderPrefectures(region);

}


/* ========= 都道府県表示 ========= */

function renderPrefectures(region){

prefList.innerHTML="";

regions[region].forEach(pref=>{

const chip =
document.createElement("div");

chip.className="pref-chip";

chip.textContent=pref;

chip.onclick=()=>{

selectedPrefecture=pref;

loadServices();

};

prefList.appendChild(chip);

});

selectedPrefecture=regions[region][0];

loadServices();

}


/* ========= 地図クリック ========= */

Object.keys(regions).forEach(region=>{

document
.getElementById(region)
.addEventListener("click",()=>{

selectRegion(region);

});

});


/* ========= 検索 ========= */

searchInput.addEventListener("input",e=>{

keyword=e.target.value.trim();

loadServices();

});


/* ========= カテゴリ ========= */

document
.querySelectorAll(".category")
.forEach(btn=>{

btn.addEventListener("click",()=>{

document
.querySelectorAll(".category")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");

selectedCategory =
btn.dataset.category;

loadServices();

});

});


/* ========= Supabase取得 ========= */

async function loadServices(){

results.innerHTML=`
<div class="empty">
読み込み中...
</div>
`;

try{

const response =
await fetch(

`${SUPABASE_URL}/rest/v1/services?select=*`,

{
headers:{
apikey:SUPABASE_KEY,
Authorization:`Bearer ${SUPABASE_KEY}`
}
}

);

const data =
await response.json();

let list =
data.filter(item=>

item.prefecture===selectedPrefecture

);

if(selectedCategory!=="すべて"){

list=list.filter(item=>

(item.category||"")===selectedCategory

);

}

if(keyword){

list=list.filter(item=>{

const text=
`${item.name}
${item.description}
${item.prefecture}
${item.category||""}`;

return text
.toLowerCase()
.includes(keyword.toLowerCase());

});

}

renderServices(list);

}catch(e){

results.innerHTML=`
<div class="empty">
データ取得エラー
</div>
`;

console.error(e);

}

}
/* ========= カード表示 ========= */

function renderServices(list){

results.innerHTML="";

if(list.length===0){

results.innerHTML=`
<div class="empty">
「${selectedPrefecture}」の無料サービスはまだ登録されていません
</div>
`;

return;

}

list.forEach(item=>{

const card=
document.createElement("div");

card.className="service-card";

const category=item.category || "無料";
const address=item.address || "";
const website=item.website || "";

card.innerHTML=`

<div class="tag-row">

<div class="tag green">
${category}
</div>

<div class="tag blue">
${item.prefecture}
</div>

</div>

<div class="service-title">
🎁 ${item.name}
</div>

<div class="service-desc">
${item.description}
</div>

${address ? `
<div style="margin-top:10px;font-size:13px;color:#6B7280;">
📍 ${address}
</div>` : ""}

${website ? `
<div style="margin-top:12px;">
<a href="${website}" target="_blank"
style="
display:inline-block;
background:#16A34A;
color:white;
text-decoration:none;
padding:10px 14px;
border-radius:10px;
font-size:13px;
font-weight:700;">
公式サイトを見る
</a>
</div>` : ""}

`;

results.appendChild(card);

});

}


/* ========= 初期起動 ========= */

selectRegion("近畿");

</script>

</body>
</html>
