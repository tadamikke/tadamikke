<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>タダミッケ AURORA v1.2</title>
<style>
body{font-family:sans-serif;background:#f3f4f6;margin:0}
header{background:linear-gradient(135deg,#16A34A,#22C55E);color:#fff;padding:22px;border-radius:0 0 24px 24px}
.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.search{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:#DCFCE7;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:bold}.service{border:1px solid #eee;border-radius:14px;padding:14px;margin-top:10px}
</style></head><body>
<header><h1>🎁 タダミッケ</h1><div>Project AURORA v1.2</div></header>
<div class="wrap">
<div class="card"><h3>🔍 検索</h3><input id="q" class="search" placeholder="IKEA・離乳食・大阪府"></div>
<div class="card"><h3>🗾 近畿</h3><div class="chips" id="chips"></div></div>
<div class="card"><h3>🎁 無料サービス</h3><div id="list"></div></div></div>
<script>
const PREFS=["大阪府","京都府","兵庫県","奈良県","滋賀県","和歌山県","三重県"];
const SUPABASE_URL="https://wobkdymgdskooprhjayf.supabase.co";
const SUPABASE_KEY="sb_publishable_BdV7sQh_wPwFgEblOD1jCA_KvVBM2bv";
let pref="大阪府";
const chips=document.getElementById("chips"),list=document.getElementById("list"),q=document.getElementById("q");
PREFS.forEach(p=>{const d=document.createElement("div");d.className="chip";d.textContent=p;d.onclick=()=>{pref=p;load()};chips.appendChild(d);});
q.oninput=load;
async function load(){
 const r=await fetch(`${SUPABASE_URL}/rest/v1/services?select=*`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
 const data=await r.json(); const kw=q.value.toLowerCase();
 const items=data.filter(x=>x.prefecture===pref && `${x.name}${x.description}`.toLowerCase().includes(kw));
 list.innerHTML=items.length?items.map(x=>`<div class='service'><b>${x.name}</b><div>${x.description}</div><small>${x.category||"無料"} / ${x.address||""}</small></div>`).join(""):"<div>登録なし</div>";
}
load();
</script></body></html>
