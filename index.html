<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タダミッケ v1.0</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  background:#f3f4f6;
  color:#222;
}

header{
  background:#16A34A;
  color:#fff;
  padding:22px;
  border-radius:0 0 24px 24px;
}

.logo{
  font-size:30px;
  font-weight:700;
}

.sub{
  opacity:.9;
  margin-top:6px;
}

.search{
  margin-top:18px;
}

.search input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

.container{
  padding:18px;
  max-width:700px;
  margin:auto;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}

h2{
  font-size:20px;
  margin-bottom:14px;
}

.map{
  background:#E5F9EC;
  border:2px dashed #16A34A;
  border-radius:16px;
  padding:30px 10px;
  text-align:center;
}

.map-icon{
  font-size:72px;
}

.map-text{
  margin-top:8px;
  color:#166534;
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

button{
  border:none;
  padding:14px;
  border-radius:12px;
  background:#F3F4F6;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button.active{
  background:#16A34A;
  color:#fff;
}

.prefs{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

.pref{
  background:#DCFCE7;
  color:#166534;
  padding:10px 14px;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
}

.pref:hover{
  background:#BBF7D0;
}

.result{
  margin-top:18px;
}

.service{
  background:#fff;
  border-radius:16px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.service-title{
  font-size:18px;
  font-weight:700;
}

.service-area{
  color:#16A34A;
  font-size:14px;
  margin-top:5px;
}

.service-description{
  margin-top:8px;
  line-height:1.6;
  color:#555;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px 5px;
}

.loading{
  text-align:center;
  color:#666;
  padding:20px;
}

footer{
  text-align:center;
  color:#6b7280;
  padding:30px 10px;
  font-size:13px;
}
</style>
</head>

<body>

<header>

  <div class="logo">🎁 タダミッケ</div>

  <div class="sub">
    全国の完全無料サービス検索
  </div>

  <div class="search">
    <input
      id="searchInput"
      type="search"
      placeholder="都道府県・サービス名を検索"
    >
  </div>

</header>


<div class="container">

  <!-- 地図 -->
  <div class="card">

    <h2>🗾 地図から探す</h2>

    <div class="map">

      <div class="map-icon">🇯🇵</div>

      <p class="map-text">
        v1.0では地方・都道府県から検索できます
      </p>

    </div>

  </div>


  <!-- 地方 -->
  <div class="card">

    <h2>地方を選択</h2>

    <div id="regions" class="grid"></div>

    <div id="prefs" class="prefs"></div>

  </div>


  <!-- 検索結果 -->
  <div class="card result">

    <h2>🔎 検索結果</h2>

    <div id="results">

      <div class="empty">
        地方または都道府県を選択してください
      </div>

    </div>

  </div>

</div>


<footer>
  © 2026 タダミッケ
</footer>


<script>

/* =========================================
   Supabase設定
========================================= */

const SUPABASE_URL =
  "https://wobkdymgdskooprhjayf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_BdV7sQh_wPwFgEblOD1jCA_KvVBM2bv";


/* =========================================
   地方・都道府県データ
========================================= */

const data = {

  "北海道":[
    "北海道"
  ],

  "東北":[
    "青森","岩手","宮城","秋田","山形","福島"
  ],

  "関東":[
    "東京","神奈川","千葉","埼玉","茨城","栃木","群馬"
  ],

  "中部":[
    "愛知","静岡","岐阜","長野","新潟",
    "富山","石川","福井","山梨"
  ],

  "近畿":[
    "大阪","京都","兵庫","奈良","滋賀","和歌山","三重"
  ],

  "中国":[
    "岡山","広島","鳥取","島根","山口"
  ],

  "四国":[
    "徳島","香川","愛媛","高知"
  ],

  "九州":[
    "福岡","佐賀","長崎","熊本",
    "大分","宮崎","鹿児島","沖縄"
  ]

};


/* =========================================
   HTML要素
========================================= */

const regions =
  document.getElementById("regions");

const prefs =
  document.getElementById("prefs");

const results =
  document.getElementById("results");

const searchInput =
  document.getElementById("searchInput");


/* =========================================
   地方表示
========================================= */

function showRegion(region){

  prefs.innerHTML = "";

  document
    .querySelectorAll("#regions button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.region === region
      );

    });


  data[region].forEach(prefecture => {

    const button =
      document.createElement("div");

    button.className = "pref";

    button.textContent = prefecture;

    button.onclick = () => {

      searchServices(prefecture);

    };

    prefs.appendChild(button);

  });

}


/* =========================================
   地方ボタン作成
========================================= */

Object.keys(data).forEach(region => {

  const button =
    document.createElement("button");

  button.dataset.region = region;

  button.textContent = region;

  button.onclick = () => {

    showRegion(region);

  };

  regions.appendChild(button);

});


/* =========================================
   Supabaseからサービス検索
========================================= */

async function searchServices(keyword){

  results.innerHTML =
    '<div class="loading">🔎 検索中...</div>';

  try{

    const prefectureMap = {
      "北海道":"北海道",
      "青森":"青森県",
      "岩手":"岩手県",
      "宮城":"宮城県",
      "秋田":"秋田県",
      "山形":"山形県",
      "福島":"福島県",
      "東京":"東京都",
      "神奈川":"神奈川県",
      "千葉":"千葉県",
      "埼玉":"埼玉県",
      "茨城":"茨城県",
      "栃木":"栃木県",
      "群馬":"群馬県",
      "愛知":"愛知県",
      "静岡":"静岡県",
      "岐阜":"岐阜県",
      "長野":"長野県",
      "新潟":"新潟県",
      "富山":"富山県",
      "石川":"石川県",
      "福井":"福井県",
      "山梨":"山梨県",
      "大阪":"大阪府",
      "京都":"京都府",
      "兵庫":"兵庫県",
      "奈良":"奈良県",
      "滋賀":"滋賀県",
      "和歌山":"和歌山県",
      "三重":"三重県",
      "岡山":"岡山県",
      "広島":"広島県",
      "鳥取":"鳥取県",
      "島根":"島根県",
      "山口":"山口県",
      "徳島":"徳島県",
      "香川":"香川県",
      "愛媛":"愛媛県",
      "高知":"高知県",
      "福岡":"福岡県",
      "佐賀":"佐賀県",
      "長崎":"長崎県",
      "熊本":"熊本県",
      "大分":"大分県",
      "宮崎":"宮崎県",
      "鹿児島":"鹿児島県",
      "沖縄":"沖縄県"
    };

    const prefecture =
      prefectureMap[keyword] || keyword;

    const url =
      `${SUPABASE_URL}/rest/v1/services?select=*&prefecture=eq.${encodeURIComponent(prefecture)}`;

    console.log("検索URL:", url);

    const response = await fetch(url, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });

    const text = await response.text();

    console.log("Supabaseレスポンス:", text);

    if(!response.ok){
      throw new Error(
        `HTTP ${response.status} ${text}`
      );
    }

    const services = JSON.parse(text);

    displayResults(services, prefecture);

  }catch(error){

    console.error("Supabaseエラー:", error);

    results.innerHTML = `
      <div class="empty">
        <strong>データを取得できませんでした</strong>
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

/* =========================================
   検索結果表示
========================================= */

function displayResults(services,keyword){

  results.innerHTML = "";


  if(services.length === 0){

    results.innerHTML = `
      <div class="empty">
        「${keyword}」の無料サービスは
        まだ登録されていません。
      </div>
    `;

    return;

  }


  services.forEach(service => {

    const card =
      document.createElement("div");

    card.className = "service";


    const title =
      service.name ||
      service.title ||
      "名称未設定";


    const area =
      service.prefecture ||
      service.area ||
      "";


    const description =
      service.description ||
      service.detail ||
      "";


    card.innerHTML = `

      <div class="service-title">
        🎁 ${escapeHtml(title)}
      </div>

      ${
        area
        ? `<div class="service-area">
             📍 ${escapeHtml(area)}
           </div>`
        : ""
      }

      ${
        description
        ? `<div class="service-description">
             ${escapeHtml(description)}
           </div>`
        : ""
      }

    `;


    results.appendChild(card);

  });

}


/* =========================================
   全文検索
========================================= */

searchInput.addEventListener(
  "input",
  () => {

    const keyword =
      searchInput.value.trim();


    if(!keyword){

      results.innerHTML = `
        <div class="empty">
          地方または都道府県を選択してください
        </div>
      `;

      return;

    }


    searchServices(keyword);

  }
);


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================
   初期表示
========================================= */

showRegion("近畿");

</script>

</body>
</html>
